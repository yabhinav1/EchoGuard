AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: EchoGuard - AI subscription and spending tracker

Parameters:
  AlertEmail:
    Type: String
    Default: ''
    Description: Email address to subscribe to reminder alerts (optional)
  EnableBedrock:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Use Claude on Amazon Bedrock for chat and the digest (billed per request). 'false' uses the free built-in assistant.
  EnableTextract:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Scan receipt photos with Amazon Textract (billed per page). 'false' keeps the free pasted-text parser.
  BedrockModelId:
    Type: String
    Default: anthropic.claude-haiku-5-5
  EnableAuth:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Require Cognito sign-in on the API ('false' = open demo API using the X-User-Id header)
  FrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Extra allowed OAuth redirect origin, e.g. a custom domain (the CloudFront URL is always allowed)
  PlaidClientId:
    Type: String
    Default: ''
    NoEcho: true
  PlaidSecret:
    Type: String
    Default: ''
    NoEcho: true
  PlaidEnv:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, development, production]
  AlexaSkillId:
    Type: String
    Default: ''
    Description: Alexa skill ID (amzn1.ask.skill.xxx). When set, only that skill can invoke the Alexa Lambda.

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  UseAuth: !Equals [!Ref EnableAuth, 'true']
  HasAlexaSkillId: !Not [!Equals [!Ref AlexaSkillId, '']]
  HasPlaid: !Not [!Equals [!Ref PlaidClientId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 512
    Architectures: [arm64]
    Environment:
      Variables:
        TABLE_NAME: !Ref TransactionsTable
        SNS_TOPIC_ARN: !Ref AlertsTopic
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        USE_BEDROCK: !Ref EnableBedrock
        USE_TEXTRACT: !Ref EnableTextract
        PLAID_CLIENT_ID: !Ref PlaidClientId
        PLAID_SECRET: !Ref PlaidSecret
        PLAID_ENV: !Ref PlaidEnv
        KMS_KEY_ID: !If [HasPlaid, !Ref SecretsKey, '']

Resources:
  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: EchoGuard alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
      # Signed-in users get their own filtered subscriptions; this address receives the demo user's alerts.
      FilterPolicy: { userId: [demo] }

  # Encrypts Plaid access tokens before they are written to DynamoDB (only created when Plaid is configured)
  SecretsKey:
    Type: AWS::KMS::Key
    Condition: HasPlaid
    Properties:
      Description: EchoGuard - encrypts Plaid access tokens
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root' }
            Action: 'kms:*'
            Resource: '*'

  # ---- Cognito ----
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 8 }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub '${FrontendOrigin}/'
        - !Sub 'https://${FrontendDistribution.DomainName}/'
      LogoutURLs:
        - !Sub '${FrontendOrigin}/'
        - !Sub 'https://${FrontendDistribution.DomainName}/'
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH, ALLOW_USER_SRP_AUTH]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub
        - 'echoguard-${Suffix}'
        - Suffix: !Select [0, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [Content-Type, Authorization, X-User-Id]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      Auth: !If
        - UseAuth
        - DefaultAuthorizer: CognitoJwt
          Authorizers:
            CognitoJwt:
              IdentitySource: $request.header.Authorization
              JwtConfiguration:
                issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
                audience: [!Ref UserPoolClient]
        - !Ref AWS::NoValue

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: src/handlers/lambda.apiHandler
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse, textract:AnalyzeExpense]
              Resource: '*'
            - Effect: Allow
              Action: sns:Subscribe
              Resource: !Ref AlertsTopic
            - Effect: Allow
              Action: sns:Unsubscribe
              Resource: '*'
            - Effect: Allow
              Action: [kms:Encrypt, kms:Decrypt]
              Resource: !If [HasPlaid, !GetAtt SecretsKey.Arn, !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/unused']

  AlexaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: src/handlers/lambda.alexaHandler
      Environment:
        Variables:
          ALEXA_USER_MAP: ''
          ALEXA_SKILL_ID: !Ref AlexaSkillId
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TransactionsTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: '*'

  AlexaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AlexaFunction
      Action: lambda:InvokeFunction
      Principal: alexa-appkit.amazon.com
      EventSourceToken: !If [HasAlexaSkillId, !Ref AlexaSkillId, !Ref AWS::NoValue]

  ReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend
      Handler: src/handlers/lambda.reminderHandler
      Environment:
        Variables:
          REMINDER_USERS: demo   # in addition to every user with an alert subscription
      Events:
        Daily:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: cron(0 14 * * ? *)   # 9am ET daily
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref TransactionsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt AlertsTopic.TopicName }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse]
              Resource: '*'

  # ---- Frontend: private S3 bucket served over HTTPS by CloudFront ----
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: EchoGuard frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          Compress: true
        # Single-page app: unknown paths (S3 returns 403 for missing keys) fall back to index.html
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

Outputs:
  AlexaFunctionArn:
    Value: !GetAtt AlexaFunction.Arn
  CognitoDomain:
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  CognitoClientId:
    Value: !Ref UserPoolClient
  CognitoUserPoolId:
    Value: !Ref UserPool
  ApiUrl:
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  FrontendUrl:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
  TableName:
    Value: !Ref TransactionsTable
